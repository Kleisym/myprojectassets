<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Проверка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg:var(--tg-theme-bg-color,#0f1115);--fg:var(--tg-theme-text-color,#e8e8ea);
        --hint:var(--tg-theme-hint-color,#8b8f98);--card:var(--tg-theme-secondary-bg-color,#171a21)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
       font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:380px;background:var(--card);border-radius:18px;padding:24px 20px;text-align:center}
  h1{font-size:19px;margin:0 0 6px}
  p{margin:0 0 18px;color:var(--hint)}
  #box{display:flex;justify-content:center;min-height:80px}
  #status{margin-top:16px;min-height:22px;font-weight:600}
  .ok{color:#3ecf8e}.err{color:#ff6b6b}
</style>
</head>
<body>
<div class="card">
  <h1>🎁 Последний шаг до награды</h1>
  <p>Реши капчу — бот сразу продолжит и выдаст ссылку.</p>
  <div id="box"></div>
  <div id="status"></div>
</div>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var q = new URLSearchParams(location.search);
  var rid = q.get('rid') || '';
  var sitekey = q.get('sitekey') || '';
  var statusEl = document.getElementById('status');
  var sent = false;

  function status(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }
  function send(payload) {
    if (sent) return;
    sent = true;
    payload.rid = rid;
    try { tg.sendData(JSON.stringify(payload)); }
    catch (e) { sent = false; status('Открой страницу кнопкой в боте.', 'err'); }
  }

  if (tg) { tg.ready(); tg.expand(); }
  if (!tg || !tg.initData) { status('Открой страницу кнопкой в боте.', 'err'); return; }
  if (!rid || !/^[0-9a-f-]{20,64}$/i.test(sitekey)) { status('Ссылка устарела — запроси заново.', 'err'); return; }

  window.onHcaptchaLoad = function () {
    try {
      hcaptcha.render('box', {
        sitekey: sitekey,
        theme: (tg.colorScheme === 'light') ? 'light' : 'dark',
        callback: function (token) {
          status('Готово ✓ возвращаю в бот…', 'ok');
          send({token: token});
        },
        'expired-callback': function () { status('Капча истекла — реши ещё раз.', 'err'); },
        'error-callback': function (code) {
          status('Ошибка капчи: ' + code, 'err');
          send({error: String(code || 'error')});
        }
      });
    } catch (e) {
      status('Не удалось загрузить капчу.', 'err');
      send({error: 'render:' + (e && e.message || e)});
    }
  };
  var s = document.createElement('script');
  s.src = 'https://js.hcaptcha.com/1/api.js?onload=onHcaptchaLoad&render=explicit&hl=ru';
  s.async = true; s.defer = true;
  s.onerror = function () { status('hCaptcha не загрузилась.', 'err'); send({error: 'script'}); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
